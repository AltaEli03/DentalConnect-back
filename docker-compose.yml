services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dentalconnect
      POSTGRES_USER: dentalconnect
      POSTGRES_PASSWORD: dentalconnect
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dentalconnect -d dentalconnect']
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://dentalconnect:dentalconnect@postgres:5432/dentalconnect?schema=public
      FRONTEND_ORIGIN: http://localhost:5173
      COGNITO_USER_POOL_ID: us-east-1_hVMMVyRtS
      COGNITO_CLIENT_ID: 2ldk42uud5g41rqepe4o4salkg
      AWS_REGION: us-east-1
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
