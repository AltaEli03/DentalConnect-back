name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore DentalConnect.slnx
      - run: dotnet build DentalConnect.slnx --no-restore -c Release
      - run: dotnet test DentalConnect.slnx --no-build -c Release
      - run: docker build --tag dentalconnect-api:ci .
